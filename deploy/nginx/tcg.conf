# nginx server block for the self-hosted Pokémon TCG viewer (TanStack Start / Nitro).
#
# Topology:  Cloudflare edge  ->  this nginx (origin shield + SWR)  ->  node :3000
#
# IMPORTANT — cache TTLs live HERE, not in the app. The app does not emit
# Cache-Control (react-start 1.168 does not forward route `headers` to the SSR
# document response). nginx is the source of truth for cache freshness; the
# values below MIRROR src/server/cache-headers.ts:
#   - SSR pages (set/card/search/pokemon): fresh 1h, serve stale up to 7d (SWR)
#   - prerendered home + series: served from node too; same SWR is fine (they
#     change ~monthly and a deploy re-prerenders them)
#   - /collection: never cache (per-user, data is client-side anyway)
#   - hashed build assets: immutable, 1y
#
# Requires nginx >= 1.11.10 (stale-while-revalidate + proxy_cache_background_update).

proxy_cache_path /var/cache/nginx/tcg
    levels=1:2 keys_zone=tcg:20m max_size=2g inactive=7d use_temp_path=off;

# Billing routes: /api/stripe/checkout|portal|sync are authenticated but each
# call burns a Stripe API request; /api/stripe/webhook is signature-gated but
# otherwise open. No app-side throttling exists (platform concern). 30r/m
# (burst 60) is loose enough for a human clicking checkout/portal a handful
# of times and for Stripe's minute-scale webhook retries, tight enough to cap
# abuse. This directive must live in the `http {}` context — it sits here,
# alongside proxy_cache_path, because this file is itself `include`d from an
# http block (see DEPLOY.md); it is NOT valid inside the `server {}` block.
limit_req_zone $binary_remote_addr zone=stripe:10m rate=30r/m;

upstream tcg_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;                       # nginx < 1.25.1: use `listen 443 ssl http2;`
    server_name tcg.example.com;    # <-- set your hostname

    # Cloudflare Origin Certificate; set CF SSL mode to "Full (strict)".
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Restore the real visitor IP from Cloudflare (else every client is a CF IP).
    include /etc/nginx/cloudflare-real-ip.conf;
    real_ip_header CF-Connecting-IP;

    # Compress the nginx -> CF hop; CF re-compresses (brotli) to the client.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Immutable hashed assets: serve from disk, never touch node. ---
    # Nitro emits client assets under .output/public/. If nginx can read that
    # path, this short-circuits node for static files. If not, delete this block
    # and let `location /` proxy them (they're content-hashed, so still cache well).
    location ~* ^/(assets|_build)/ {
        root /var/www/tcg/.output/public;
        try_files $uri @proxy;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Per-user: never cache. Collection data lives in the browser (IndexedDB). ---
    location = /collection {
        proxy_pass http://tcg_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }

    # --- Stripe billing routes: rate-limited, never cached. ---
    # checkout/portal/sync are authenticated (each hits the Stripe API);
    # webhook is signature-gated, not auth-gated. Proxy directives copied
    # verbatim from `location @proxy` below. No proxy_request_buffering or
    # other body-touching directive here — the webhook needs the raw request
    # body intact for Stripe signature verification.
    location /api/stripe/ {
        limit_req zone=stripe burst=60 nodelay;

        proxy_pass http://tcg_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }

    # --- Account routes (self-serve deletion, etc): same rate limit as billing. ---
    # Authenticated, hits Supabase admin + Stripe APIs per request — cap abuse
    # the same way as /api/stripe/. Proxy directives copied verbatim.
    location /api/account/ {
        limit_req zone=stripe burst=60 nodelay;

        proxy_pass http://tcg_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }

    # --- Health check: never serve a stale-cached "healthy" lie. ---
    # Without this, /api/health falls through to `@proxy` below, which is
    # SWR-cached with s-maxage=3600 — during a real outage CF (and any local
    # monitoring hitting this box directly) would keep getting a cached 200
    # from before the box broke, for up to an hour. Proxy directives copied
    # verbatim from `location @proxy`.
    location = /api/health {
        proxy_pass http://tcg_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # --- Everything else: SSR HTML, reverse-proxied + SWR-cached. ---
    location / {
        try_files _ @proxy;     # always go through the named proxy below
    }

    location @proxy {
        proxy_pass http://tcg_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache tcg;
        # nginx owns the TTLs (the app sends none). Mirror cache-headers.ts:
        #   "ssr" => fresh 1h.  SWR window handled by use_stale below.
        proxy_cache_valid 200 301 308 1h;
        proxy_cache_valid 404 1m;

        # SWR: serve stale instantly, refresh in the background. The 7d window
        # is bounded by `inactive=7d` on proxy_cache_path.
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;

        # Collapse concurrent misses for one URL into a single upstream render.
        # Critical for the cold 20k-card long tail and for the ~1s deploy restart.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;

        # Don't store personalized responses (defensive; the app is cookieless).
        proxy_no_cache     $http_authorization;
        proxy_cache_bypass $http_authorization;

        # Send a sane Cache-Control to CF + browsers since the app emits none.
        # CF honors s-maxage; browsers get a short max-age + SWR.
        add_header Cache-Control "public, max-age=60, s-maxage=3600, stale-while-revalidate=604800" always;
        add_header X-Cache-Status $upstream_cache_status always;   # debug: curl -I
    }
}

# --- Cloudflare Tunnel variant ---------------------------------------------
# If you front the box with `cloudflared` instead of exposing the origin IP:
#   * replace the two `listen 443 ssl` + `http2` lines with `listen 80;`
#   * drop the ssl_certificate lines and the cloudflare-real-ip include
#     (cloudflared forwards CF-Connecting-IP; trust 127.0.0.1)
# Everything else is identical.
