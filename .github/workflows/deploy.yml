# Self-hosted deploy: build the TanStack Start app and ship the Nitro output to
# the home server, then restart the systemd service. Replaces the old GitHub
# Pages workflow (the app is now SSR, not a static SPA).
#
# Runs on a SELF-HOSTED runner installed on the home box (labels: self-hosted, tcg).
# The runner dials out to GitHub (no inbound port needed behind home NAT).
#
# SECURITY (this is a PUBLIC repo): never add `pull_request` or
# `pull_request_target` to a job that runs on [self-hosted, tcg]. A fork PR would
# then execute attacker-controlled code on the home box. Self-hosted jobs may
# trigger ONLY on push:[main], workflow_dispatch, or schedule — all of which
# require repo write access. The `production` environment below additionally
# pins execution to the main branch.
#
# One-time setup + the sudoers rule for the restart are documented in
# deploy/DEPLOY.md.
#
# BILLING (private plugin injection): gated behind repo variable
# `vars.DEPLOY_BILLING == '1'` so deploys stay green with or without the paid
# tier wired up (007 §D.1). When enabled, the private `card-stack-cloud` repo
# is checked out with deploy-key secret `secrets.CLOUD_DEPLOY_KEY` (007 §D.1)
# and its build output is copied into the server's node_modules AFTER the
# public build finishes — the public `Build (Vite + Nitro)` step above runs
# first and unmodified, which is the standing proof that the open-core build
# still succeeds with the plugin completely absent (see
# docs/superpowers/specs/2026-06-19-cloud-vault-billing-design.md). Client
# vars VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are repo Variables (anon key
# is public by design), set alongside VITE_API_BASE (007 §D.3).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A newer push supersedes an in-flight deploy.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, tcg]
    # The `production` environment carries a deployment-branch rule (main only),
    # so a workflow_dispatch aimed at any other ref is blocked BEFORE the
    # self-hosted runner executes a single step — a platform-enforced "main only"
    # guarantee on top of the push trigger above. Configure once at:
    #   repo Settings -> Environments -> New environment "production"
    #   -> Deployment branches and tags -> Selected -> add rule: main
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build (Vite + Nitro)
        # VITE_API_BASE is baked into the client bundle at build time (the corpus
        # fetch + any client API call go through the CF Worker). Set it as a repo
        # variable: Settings -> Secrets and variables -> Actions -> Variables.
        # VITE_API_BASE → client bundle (corpus fetch). API_BASE → server loaders +
        # the server-side corpus fetch during prerender. Both = the CF Worker URL
        # (repo Variable). Without API_BASE, prerender falls back to the public API.
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          API_BASE: ${{ vars.VITE_API_BASE }}
          # Cloud vault UI client config (007 §D.3). Anon key is public by
          # design (RLS enforces access) — repo Variables, not Secrets.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        # build:check runs the client-bundle leak guard after the build — fails
        # the deploy if any server-only code (node:zlib, process.env, server
        # corpus loader) leaked into .output/public. This build has NO billing
        # plugin present — the standing proof the open-core build succeeds
        # without it. The plugin is injected AFTER this step, below.
        run: bun run build:check

      # --- Billing plugin injection (007 §D.1, §D.5) -----------------------
      # Off by default so deploys stay green before the owner provisions the
      # deploy key. Flip `vars.DEPLOY_BILLING = '1'` once ready (007 §F.2).
      #
      # RUNTIME env is a separate, manual prerequisite: the injected plugin
      # (and /api/health's counts, and the server's SSR Supabase reads) pull
      # SUPABASE_*/STRIPE_*/APP_ORIGIN/VITE_SUPABASE_* from the systemd
      # EnvironmentFile (/etc/tcg/env) at RUNTIME — nothing in this workflow
      # provides them. Inventory + placement: deploy/DEPLOY.md, 007 §D.2.
      # The VITE_ vars above only bake into the client bundle at build time.
      - name: Checkout billing plugin
        if: ${{ vars.DEPLOY_BILLING == '1' }}
        uses: actions/checkout@v4
        with:
          # TODO(owner, 007 §D.1): fill in the real owner/org once known — this
          # placeholder will fail checkout until corrected. Verified locally:
          # `card-stack-cloud` has no `git remote` configured yet, so the real
          # slug can't be determined from the repo itself.
          repository: <OWNER>/card-stack-cloud
          # Pin an exact commit SHA, never a branch: this job runs on the
          # self-hosted home-box runner, and a floating ref would let anyone
          # with push access to the (separate, less-scrutinized) plugin repo
          # change what code executes here without a review gate in THIS
          # repo's history. Bump the SHA deliberately when the plugin
          # advances (007 §D.5).
          ref: a47368d29f94a651ed213e4fdbba0b426033fcfb
          ssh-key: ${{ secrets.CLOUD_DEPLOY_KEY }}
          path: cloud-plugin

      - name: Build + test billing plugin
        if: ${{ vars.DEPLOY_BILLING == '1' }}
        working-directory: cloud-plugin
        run: |
          bun install --frozen-lockfile
          bun run build
          bun test

      - name: Inject billing plugin into server output
        if: ${{ vars.DEPLOY_BILLING == '1' }}
        # The plugin's own runtime deps (stripe, @supabase/*) are installed
        # into a nested node_modules under the plugin dir — Node resolution
        # walks up from @tcgvault/cloud/dist/*.js and finds them there, no
        # collision with whatever Nitro bundled for the core. --ignore-scripts
        # is required: package.json's `prepare` re-runs `tsc`, but we only
        # copied `dist` (prebuilt above), not the source/tsconfig, so the
        # prepare script has nothing to compile and fails the install.
        run: |
          PLUG=.output/server/node_modules/@tcgvault/cloud
          mkdir -p "$PLUG"
          cp -r cloud-plugin/package.json cloud-plugin/dist "$PLUG"/
          (cd "$PLUG" && bun install --production --ignore-scripts)

      - name: Ship .output to the server tree
        # Same box as the runner, so a local rsync. --delete prunes stale files.
        run: rsync -a --delete .output/ /var/www/tcg/.output/

      - name: Restart the service
        # Needs a sudoers rule allowing exactly this command for the runner user
        # (see deploy/DEPLOY.md). nginx serves stale cache through the ~1s restart.
        run: sudo systemctl restart tcg

      - name: Post-deploy health gate
        # Fails the deploy loudly if the box comes back misconfigured, instead
        # of waiting for the first paying customer to find out (006 Task 2).
        run: |
          sleep 3
          if [ "${{ vars.DEPLOY_BILLING }}" == "1" ]; then
            curl -sf http://127.0.0.1:3000/api/health | grep -q '"plugin":"present"'
          else
            curl -sf http://127.0.0.1:3000/api/health
          fi
