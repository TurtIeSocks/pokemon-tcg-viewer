# Rebuild the card corpus + redeploy the Cloudflare Worker when a corpus-shaping
# file (or the worker itself) lands on main. Chains: build corpus → upload to R2 →
# deploy worker. So merging a change to the crosswalk / build scripts / worker
# routes reaches prod without a manual dispatch.
#
# Scope note: this rebuilds the corpus (a multi-minute crawl of TCGdex + tcgcsv +
# PokéAPI), so the paths below are ONLY files that change the corpus blob or the
# worker. App/UI changes deploy separately via deploy.yml. The app deploy and this
# pipeline run in parallel on a merge, so there is a short window where the app is
# live before fresh R2 + the redeployed worker land — self-healing within minutes.
name: Rebuild corpus + deploy worker

on:
  push:
    branches: [main]
    paths:
      # Corpus build logic
      - "scripts/build-corpus.ts"
      - "scripts/tcgcsv-overlay.ts"
      - "scripts/build-i18n.ts"
      - "scripts/merge-overlay.ts"
      - "scripts/ptcg-overlay.ts"
      - "scripts/normalize-rarity.ts"
      # Committed data the build bakes in
      - "scripts/data/tcgcsv-crosswalk.json"
      - "scripts/data/tcgcsv-crosswalk.manual.json"
      - "src/lib/corpus/id-crosswalk.ts"
      - "src/lib/corpus/set-crosswalk.json"
      - "src/lib/corpus/ptcg-image-overrides.json"
      - "src/lib/corpus/tcgdex-card-fields.ts"
      # Worker (routes / CORS / proxy)
      - "worker/src/**"
      - "worker/wrangler.toml"
  workflow_dispatch: {}

# Least privilege: only reads the repo; R2 + worker deploy use the CF API token.
permissions:
  contents: read

# A newer push supersedes an in-flight rebuild.
concurrency:
  group: rebuild-corpus
  cancel-in-progress: true

jobs:
  # Reuse the full build-corpus pipeline (mirror service, west+asia corpus, i18n
  # overlays, R2 upload). secrets: inherit passes CLOUDFLARE_API_TOKEN etc.
  corpus:
    uses: ./.github/workflows/build-corpus.yml
    secrets: inherit

  deploy-worker:
    needs: corpus # only after the fresh corpus is in R2
    runs-on: ubuntu-latest
    # `production` pins execution to main (Settings → Environments) — same gate the
    # app deploy uses.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Deploy the Cloudflare Worker
        working-directory: worker
        # The token needs Workers Scripts:Edit (the R2-upload token above only needs
        # Workers R2 Storage:Edit — broaden it, or set a separate deploy-scoped
        # secret and reference it here).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
