name: Build card corpus
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch: {}

# Least privilege: the job only reads the repo; R2 upload uses an API token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      tcgdex:
        # No `latest` tag is published; `edge` tracks master. MAX_WORKERS caps the
        # per-core worker fork (default OOMs), TCGCSV_USER_AGENT silences a
        # non-fatal price-loader throw on boot.
        image: tcgdex/server:edge
        env:
          MAX_WORKERS: 2
          TCGCSV_USER_AGENT: cardstack-corpus-build/1.0
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build corpus blob (Western/en base)
        env:
          TCGDEX_BASE: http://localhost:3000/v2/en
        run: bun run scripts/build-corpus.ts corpus.json.gz
      - name: Build corpus blob (Asian/ja base)
        # baseUrlFor() swaps the trailing /en of TCGDEX_BASE for /ja, so the same
        # mirror serves the JP-lineage catalog. --base-lang ja skips the
        # pokemontcg.io overlay (no crosswalk for JP ids) and writes the
        # corpus*.asia.* outputs.
        env:
          TCGDEX_BASE: http://localhost:3000/v2/en
        run: bun run scripts/build-corpus.ts corpus.asia.json.gz --base-lang ja
      - name: Build i18n overlays (fr/de/es/it/pt + ko/zh-tw/zh-cn/th/id)
        # build-i18n crawls each lang's own set tree via langBase(); the Asian
        # langs resolve to JP-lineage ids that overlay the Asian base corpus.
        env:
          TCGDEX_BASE: http://localhost:3000/v2/en
        run: bun run scripts/build-i18n.ts
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Western/en base corpus + detail.
          bunx wrangler r2 object put \
            pokemon-tcg-corpus/corpus/latest.json.gz \
            --file=corpus.json.gz --remote
          bunx wrangler r2 object put \
            pokemon-tcg-corpus/corpus/detail-latest.json.gz \
            --file=corpus-detail.json.gz --remote
          bunx wrangler r2 object put \
            pokemon-tcg-corpus/corpus/detail-meta.json \
            --file=corpus-detail.meta.json --remote
          # Asian/ja region base corpus + detail + version meta.
          bunx wrangler r2 object put \
            pokemon-tcg-corpus/corpus/region/asia/latest.json.gz \
            --file=corpus.asia.json.gz --remote
          bunx wrangler r2 object put \
            pokemon-tcg-corpus/corpus/region/asia/detail-latest.json.gz \
            --file=corpus-detail.asia.json.gz --remote
          bunx wrangler r2 object put \
            pokemon-tcg-corpus/corpus/region/asia/meta.json \
            --file=corpus-detail.asia.meta.json --remote
          # Name overlays: Western (en base) + Asian (ja base).
          for lang in fr de es it pt ko zh-tw zh-cn th id; do
            bunx wrangler r2 object put \
              "pokemon-tcg-corpus/corpus/i18n/$lang/names.json.gz" \
              --file="corpus/i18n/$lang/names.json.gz" --remote
            bunx wrangler r2 object put \
              "pokemon-tcg-corpus/corpus/i18n/$lang/meta.json" \
              --file="corpus/i18n/$lang/meta.json" --remote
          done
      - name: Upload gap logs (inspect only)
        uses: actions/upload-artifact@v4
        with:
          name: corpus-gap
          path: |
            corpus-gap.json
            corpus-gap.asia.json
