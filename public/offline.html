<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0d0a16" />
		<title>Offline — Cardstack</title>
		<style>
			:root {
				color-scheme: dark;
				--canvas: #0d0a16;
				--ink: #f4f1fb;
				--ink-muted: #b7b0c9;
				--primary: oklch(0.7 0.19 295);
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
			}
			body {
				display: grid;
				place-items: center;
				padding: 1.5rem;
				background:
					radial-gradient(
						60rem 40rem at 50% -10%,
						oklch(0.7 0.19 295 / 0.18),
						transparent 60%
					),
					var(--canvas);
				color: var(--ink);
				font-family:
					"Space Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
				-webkit-font-smoothing: antialiased;
				text-align: center;
			}
			.card {
				max-width: 26rem;
				width: 100%;
				padding: 2.25rem 1.75rem;
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 1.5rem;
				background: rgba(255, 255, 255, 0.05);
				backdrop-filter: blur(20px);
				box-shadow:
					inset 0 1px 0 rgba(255, 255, 255, 0.28),
					inset 0 -1px 0 rgba(0, 0, 0, 0.35),
					0 24px 60px rgba(0, 0, 0, 0.5);
			}
			.dot {
				width: 0.6rem;
				height: 0.6rem;
				border-radius: 999px;
				background: var(--primary);
				display: inline-block;
				margin-right: 0.5rem;
				vertical-align: middle;
			}
			.eyebrow {
				font-size: 0.75rem;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				color: var(--ink-muted);
				margin: 0 0 0.75rem;
			}
			h1 {
				font-size: 1.6rem;
				line-height: 1.2;
				margin: 0 0 0.6rem;
			}
			p {
				color: var(--ink-muted);
				line-height: 1.55;
				margin: 0 0 1.5rem;
			}
			.links {
				display: flex;
				gap: 0.75rem;
				justify-content: center;
				flex-wrap: wrap;
			}
			a {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				padding: 0.6rem 1.2rem;
				border-radius: 999px;
				text-decoration: none;
				font-weight: 600;
				font-size: 0.95rem;
				border: 1px solid rgba(255, 255, 255, 0.14);
				color: var(--ink);
				background: rgba(255, 255, 255, 0.06);
				transition: transform 0.15s ease, background 0.15s ease;
			}
			a.primary {
				background: var(--primary);
				color: #14061f;
				border-color: transparent;
			}
			a:hover {
				transform: translateY(-1px);
				background: rgba(255, 255, 255, 0.12);
			}
			a.primary:hover {
				background: oklch(0.76 0.19 295);
			}
			@media (prefers-reduced-motion: reduce) {
				a {
					transition: none;
				}
			}
		</style>
	</head>
	<body>
		<main class="card">
			<p class="eyebrow"><span class="dot"></span>Offline</p>
			<h1>You're offline</h1>
			<p>
				No connection right now. Your Vault and any cards you've already
				viewed still work. Reconnect to browse the full catalog.
			</p>
			<div class="links">
				<a class="primary" href="/">Home</a>
				<a href="/vault">Your Vault</a>
			</div>
		</main>
	</body>
</html>
