name = "pokemon-tcg-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Set the browser origin allowed to call this proxy (your Pages URL):
#   wrangler deploy --var ALLOW_ORIGIN:https://<user>.github.io
# Set the API key as a secret (never commit it):
#   wrangler secret put POKEMONTCG_API_KEY
[vars]
ALLOW_ORIGIN = "*"

# R2 bucket holding the prebuilt card corpus blob (corpus/latest.json.gz),
# uploaded by the build-corpus GitHub Action. Served by the /corpus route.
[[r2_buckets]]
binding = "CORPUS"
bucket_name = "pokemon-tcg-corpus"
